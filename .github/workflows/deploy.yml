name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [master]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    environment: Website
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Restore
        run: dotnet restore LifeDash.Api/LifeDash.Api.csproj

      - name: Build
        run: dotnet build LifeDash.Api/LifeDash.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish LifeDash.Api/LifeDash.Api.csproj --configuration Release --output ./publish --no-build

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
